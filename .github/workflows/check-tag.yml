name: Check Tag

on:
  push:
    tags:
      - '**'
  workflow_call:

jobs:
  validate-tag-branch:
    name: Validate Tag is on Main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag commit is on main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Tag must be created from the main branch."
            exit 1
          fi
          echo "Tag commit is on the main branch."
