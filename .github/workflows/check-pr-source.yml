name: Check PR Source Branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    name: Require PR from dev
    runs-on: ubuntu-latest

    steps:
      - name: Verify source branch is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests to main must originate from the 'dev' branch. This PR is from '${{ github.head_ref }}'."
            exit 1
          fi
          echo "Source branch is 'dev'. Check passed."
